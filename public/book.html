<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waitline — Book an Appointment</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header">
  <h1>Waitline</h1>
  <nav aria-label="Primary">
    <a href="index.html">Find a Slot</a>
    <a href="my-bookings.html">My Bookings</a>
  </nav>
</header>

<main id="main-content">
  <h2>Book an appointment</h2>
  <p id="slotInfo" class="muted">Loading slot details…</p>

  <p id="message" role="alert" tabindex="-1" style="display:none;"></p>

  <form id="bookingForm">
    <div class="form-field">
      <label for="patientName">Full name</label>
      <input id="patientName" name="patientName" type="text" required>
    </div>
    <div class="form-field">
      <label for="patientEmail">Email</label>
      <input id="patientEmail" name="patientEmail" type="email" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Confirm booking</button>
  </form>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const slotId = params.get('slotId');
const slotInfo = document.getElementById('slotInfo');
const message = document.getElementById('message');
const form = document.getElementById('bookingForm');
const submitBtn = document.getElementById('submitBtn');

async function loadSlot() {
  if (!slotId) {
    slotInfo.textContent = 'No slot selected.';
    return;
  }
  try {
    const res = await fetch(`/api/slots/${slotId}`);
    if (!res.ok) throw new Error('not found');
    const slot = await res.json();
    slotInfo.textContent =
      `${slot.clinic_name} with ${slot.doctor_name} — ${new Date(slot.starts_at).toLocaleString()}`;
  } catch (err) {
    slotInfo.textContent = 'This slot could not be found.';
  }
}

function showMessage(text, type) {
  message.textContent = text;
  message.className = type === 'success' ? 'message-success' : 'message-error';
  message.style.display = 'block';
  message.focus();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Booking…';

  const patientName = document.getElementById('patientName').value.trim();
  const patientEmail = document.getElementById('patientEmail').value.trim();

  try {
    const res = await fetch('/api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slotId, patientName, patientEmail }),
    });
    const data = await res.json();

    if (!res.ok) {
      showMessage(
        res.status === 409 ? 'Sorry, this slot just filled up.' : (data.error || 'Something went wrong.'),
        'error'
      );
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm booking';
      return;
    }

    showMessage('Booking confirmed! Redirecting to your bookings…', 'success');
    setTimeout(() => { window.location.href = 'my-bookings.html'; }, 1200);
  } catch (err) {
    showMessage('Could not reach the server. Please try again.', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Confirm booking';
  }
});

loadSlot();
</script>

</body>
</html>
